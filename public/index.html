<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Ornativa Jewellery Chatbot</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f4f4f4;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .chat-container {
      width: 550px;
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
    }

    .header {
      background: black;
      color: white;
      padding: 20px;
    }

    .header h2 {
      margin: 0;
    }

    .messages {
      height: 500px;
      overflow-y: auto;
      padding: 20px;
      background: #fafafa;
    }

    .message {
      margin-bottom: 15px;
      display: flex;
    }

    .user {
      justify-content: flex-end;
    }

    .bot {
      justify-content: flex-start;
    }

    .bubble {
      max-width: 75%;
      padding: 12px 16px;
      border-radius: 14px;
      line-height: 1.5;
      font-size: 15px;
    }

    .user .bubble {
      background: black;
      color: white;
    }

    .bot .bubble {
      background: #e5e5e5;
      color: black;
    }

    .input-area {
      display: flex;
      border-top: 1px solid #ddd;
    }

    .input-area input {
      flex: 1;
      border: none;
      padding: 16px;
      font-size: 15px;
      outline: none;
    }

    .input-area button {
      border: none;
      background: black;
      color: white;
      padding: 16px 24px;
      cursor: pointer;
    }

    .input-area button:hover {
      background: #333;
    }
  </style>
</head>

<body>

  <div class="chat-container">

    <div class="header">
      <h2>Ornativa Jewellery Assistant</h2>
    </div>

    <div class="messages" id="messages">

      <div class="message bot">
        <div class="bubble">
          Hello! I am Ornativa’s virtual jewellery expert.
          Ask me about jewellery products, prices, materials, or availability.
        </div>
      </div>

    </div>

    <div class="input-area">

      <input
        type="text"
        id="question"
        placeholder="Ask about jewellery..."
      />

      <button onclick="sendMessage()">
        Send
      </button>

    </div>

  </div>

  <script>

    async function sendMessage() {

      const input = document.getElementById("question")
      const messages = document.getElementById("messages")

      const question = input.value.trim()

      if (!question) return

      // Add user message
      messages.innerHTML += `
        <div class="message user">
          <div class="bubble">
            ${question}
          </div>
        </div>
      `

      input.value = ""

      messages.scrollTop = messages.scrollHeight

      // Loading message
      const loadingId = "loading-" + Date.now()

      messages.innerHTML += `
        <div class="message bot" id="${loadingId}">
          <div class="bubble">
            Thinking...
          </div>
        </div>
      `

      messages.scrollTop = messages.scrollHeight

      try {

        const response = await fetch("/chat", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            question: question
          })
        })

        const data = await response.json()

        document.getElementById(loadingId).remove()

        messages.innerHTML += `
          <div class="message bot">
            <div class="bubble">
              ${data.text || "No response received"}
            </div>
          </div>
        `

      } catch (error) {

        document.getElementById(loadingId).remove()

        messages.innerHTML += `
          <div class="message bot">
            <div class="bubble">
              Error connecting to chatbot.
            </div>
          </div>
        `
      }

      messages.scrollTop = messages.scrollHeight
    }

    document
      .getElementById("question")
      .addEventListener("keypress", function(event) {

        if (event.key === "Enter") {
          sendMessage()
        }
      })

  </script>

</body>
</html>
